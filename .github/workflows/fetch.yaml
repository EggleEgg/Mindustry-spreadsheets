name: Fetch Google Sheet Data

# yaml-embedded-languages: python

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub

jobs:
  download-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch and process sheet data
        env:
          # Google apps script. Raw url outputs json with necessary data such as styling and resources (images, etc)
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          import urllib.request

          # Ensure stdout/stderr are flushed immediately for real-time logging in Actions
          sys.stdout.reconfigure(line_buffering=True)

          APPS_SCRIPT_URL = os.environ["APPS_SCRIPT_URL"]
          print(f"DEBUG: APPS_SCRIPT_URL length: {len(APPS_SCRIPT_URL)}", flush=True)

          print("DEBUG: Opening sources.json", flush=True)
          with open("sources.json", "r", encoding="utf-8") as f:
              sources = json.load(f)
          print(f"DEBUG: Loaded {len(sources)} sources from sources.json", flush=True)

          for idx, source in enumerate(sources):
              filename = source["name"]
              gid = source.get("gid", "")
              url = f"{APPS_SCRIPT_URL}?gid={gid}"

              print(f"[{idx+1}/{len(sources)}] Fetching {filename} from Apps Script (gid={gid})", flush=True)
              try:
                  with urllib.request.urlopen(url, timeout=60) as resp:
                      print(f"[{idx+1}/{len(sources)}] Received response for {filename}, status: {resp.status}", flush=True)
                      body_bytes = resp.read()
                      print(f"[{idx+1}/{len(sources)}] Read {len(body_bytes)} bytes for {filename}", flush=True)
                      payload = json.loads(body_bytes.decode("utf-8"))
              except Exception as e:
                  print(f"ERROR: Failed to fetch or parse {filename}: {e}", flush=True)
                  raise

              raw_rows = payload.get("rows", [])
              merges = payload.get("merges", [])
              num_cols = len(raw_rows[0]) if raw_rows else 0
              print(f"[{idx+1}/{len(sources)}] Processing {filename}: {len(raw_rows)} rows, {num_cols} cols, {len(merges)} merges", flush=True)

              # Map every covered cell of a real merge to its anchor cell's coordinates
              covered_by = {}
              for m in merges:
                  r0, c0, nr, nc = m["row"], m["col"], m["numRows"], m["numCols"]
                  for rr in range(r0, r0 + nr):
                      for cc in range(c0, c0 + nc):
                          if (rr, cc) != (r0, c0):
                              covered_by[(rr, cc)] = (r0, c0)

              # Fill down/across merges in the body rows only, header rows are handled separately below
              for r in range(2, len(raw_rows)):
                  for c in range(num_cols):
                      if (r, c) in covered_by:
                          ar, ac = covered_by[(r, c)]
                          raw_rows[r][c] = raw_rows[ar][ac]

              # Build the flat header row. Each column's label is whichever of the two header rows' own cells actually has text
              columns = []
              for i in range(num_cols):
                  if i == 0:
                      columns.append("Block")
                      continue
                  if i == 1:
                      columns.append("Boost")
                      continue
                  col1 = str(raw_rows[0][i]["value"] or "").strip()
                  col2 = str(raw_rows[1][i]["value"] or "").strip()
                  if col1 and col2:
                      columns.append(f"{col1} - {col2}")
                  elif col1:
                      columns.append(col1)
                  elif col2:
                      columns.append(col2)
                  else:
                      columns.append("")

              body_rows = raw_rows[2:]

              with open(filename, "w", encoding="utf-8") as f:
                  json.dump({"columns": columns, "rows": body_rows}, f)
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: update spreadsheet data from sources" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
