name: Fetch Google Spreadsheets

# yaml-embedded-languages: python

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger from GitHub

jobs:
  download-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Process Spreadsheets
        run: |
          python3 -c '
          import json
          import csv
          import urllib.request
          import os

          config_path = "sources.json"
          if os.path.exists(config_path):
              with open(config_path, "r", encoding="utf-8") as f:
                  sources = json.load(f)
          else:
              sources = [{
                  "name": "throughput_vX.csv",
                  "url": "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbJ4xGVG4ZyWVi0vK_u67u0enFH5ckwUuEceEkxZEsFjt__AIA9Gn76sZXEqjFyt8eZMk68fEFWRTl/pub?output=csv&gid=1669293901"
              }]

          for source in sources:
              filename = source["name"]
              url = source["url"]
              if "gid" in source and "gid=" not in url:
                  separator = "&" if "?" in url else "?"
                  url = f"{url}{separator}gid={source[\"gid\"]}"

              print(f"Fetching {filename} from {url}")
              urllib.request.urlretrieve(url, filename)

              with open(filename, "r", encoding="utf-8") as f:
                  rows = list(csv.reader(f))
              if len(rows) >= 2:
                  h1 = rows[0]
                  h2 = rows[1]
                  new_header = []
                  current_group = ""
                  for i, (col1, col2) in enumerate(zip(h1, h2)):
                      if col1.strip():
                          current_group = col1.strip()
                      if i == 0:
                          new_header.append("Block")
                          continue
                      if i == 1:
                          new_header.append("Boost")
                          continue
                      sub = col2.strip()
                      if current_group and "fps" in current_group and sub:
                          new_header.append(f"{current_group} - {sub}")
                      elif current_group and "fps" in current_group:
                          new_header.append(current_group)
                      elif sub:
                          new_header.append(sub)
                      elif current_group:
                          new_header.append(current_group)
                      else:
                          new_header.append(f"Col_{i}")
                  rows[0] = new_header
                  rows.pop(1)
              with open(filename, "w", newline="", encoding="utf-8") as f:
                  writer = csv.writer(f)
                  writer.writerows(rows)
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: update spreadsheet data from sources" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
