name: Fetch Google Sheet Data

# yaml-embedded-languages: python

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub

jobs:
  download-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch and process sheet data
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import urllib.request

          APPS_SCRIPT_URL = os.environ["APPS_SCRIPT_URL"]

          with open("sources.json", "r", encoding="utf-8") as f:
              sources = json.load(f)

          for source in sources:
              filename = source["name"]
              gid = source.get("gid", "")
              url = f"{APPS_SCRIPT_URL}?gid={gid}"

              print(f"Fetching {filename} from Apps Script (gid={gid})")
              with urllib.request.urlopen(url) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))

              raw_rows = payload["rows"]

              # Same two-row header merge as before, but pulled from the
              # "value" field of each cell instead of raw CSV columns.
              h1 = [cell["value"] for cell in raw_rows[0]]
              h2 = [cell["value"] for cell in raw_rows[1]]
              columns = []
              current_group = ""
              for i, (col1, col2) in enumerate(zip(h1, h2)):
                  col1 = (col1 or "").strip()
                  col2 = (col2 or "").strip()
                  if col1:
                      current_group = col1
                  if i == 0:
                      columns.append("Block")
                      continue
                  if i == 1:
                      columns.append("Boost")
                      continue
                  if current_group and "fps" in current_group and col2:
                      columns.append(f"{current_group} - {col2}")
                  elif current_group and "fps" in current_group:
                      columns.append(current_group)
                  elif col2:
                      columns.append(col2)
                  elif current_group:
                      columns.append(current_group)
                  else:
                      columns.append(f"Col_{i}")

              body_rows = raw_rows[2:]

              with open(filename, "w", encoding="utf-8") as f:
                  json.dump({"columns": columns, "rows": body_rows}, f)
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: update spreadsheet data from sources" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
